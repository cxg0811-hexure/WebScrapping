# Generated with GitHub Copilot - [Tracking ID: Hexure-Copilot]
name: Scrape prices and publish

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata
  USE_SYSTEM_CERTS: "0"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        if: github.event_name == 'push'
        run: python -m pytest -q

      - name: Scrape all stores
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python run_scraper.py

      - name: Build static site
        run: python build_static.py site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # Scheduled workflows are disabled after 60 days without repo activity; re-enabling resets that timer.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scrape.yml/enable"
